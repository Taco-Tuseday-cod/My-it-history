<html>
<head>
<meta charset='UTF-8'>
<title>ペイントアプリ</title>
</head>
<body>
<script>

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 500;
canvas.style.border = '1px solid black';

const context = canvas.getContext('2d');


/* 描画 */

canvas.onmousedown = function(e) {

  const rect = canvas.getBoundingClientRect();

  let x = e.clientX - rect.left;
  let y = e.clientY - rect.top;

  context.beginPath();
  context.moveTo(x, y);

  canvas.onmousemove = function(e) {

    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    context.lineTo(x, y);
    context.stroke();

  };

  function stopDraw() {
    canvas.onmousemove = null;
  }

  canvas.onmouseup = stopDraw;
  canvas.onmouseout = stopDraw;
};


/* カラーピッカー */

const colorPicker = document.createElement('input');
colorPicker.type = 'color';

colorPicker.onchange = function() {
  context.strokeStyle = colorPicker.value;
};


/* 線の太さ */

const lineWidthSlider = document.createElement('input');
lineWidthSlider.type = 'range';
lineWidthSlider.min = 1;
lineWidthSlider.max = 20;
lineWidthSlider.value = 1;

lineWidthSlider.oninput = function() {
  context.lineWidth = lineWidthSlider.value;
};


/* 文字描画 */

const textInput = document.createElement('input');
textInput.type = 'text';

const textButton = document.createElement('button');
textButton.textContent = '文字を描画';

textButton.onclick = function() {

  context.fillStyle = colorPicker.value;
  context.fillText(textInput.value, 50, 50);

};


/* クリア */

const clearButton = document.createElement('button');
clearButton.textContent = 'クリア';

clearButton.onclick = function() {

  context.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

};


/* 表示位置 */

const container = document.createElement('div');
container.style.width = canvas.width + 'px';

const controls = document.createElement('div');
controls.style.marginTop = '10px';

controls.append(colorPicker);
controls.append(lineWidthSlider);
controls.append(textInput);
controls.append(textButton);
controls.append(clearButton);

container.append(canvas);
container.append(controls);

document.body.append(container);

</script>
</body>
</html>
